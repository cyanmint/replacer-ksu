# Replacer main configuration
# This file supports %include directive to include other configurations
# Note: ${mod_dir} is automatically substituted by KernelSU
#
# IMPORTANT: Place replacement files in safe locations!
# ✅ GOOD: ${mod_dir}/files/ or /data/replacements/
# ❌ BAD:  /data/adb/* (may cause bootloop - not accessible during early boot)
#
# How it works:
# - If original file doesn't exist, it will be created from replacement
# - If replacement file doesn't exist, the operation is skipped

# Include system-wide configuration file
%include, /data/adb/replacer.conf
